[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cfo-toolkit"
version = "0.1.0"
description = "Small, auditable FP&A helpers for startups: variance, forecasts, runway, and a monthly CFO pack"
authors = [{name = "Diana Kwon"}]
license = {text = "MIT"}
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
